# LongLive, inference only: configs/longlive_inference.yaml of the original repo, reduced to the
# keys inference reads. Checkpoint paths are passed on the command line (see idforcing.py).
denoising_step_list:
- 1000
- 750
- 500
- 250
warp_denoising_step: true
num_frame_per_block: 3
model_kwargs:
  local_attn_size: 12
  timestep_shift: 5.0
  sink_size: 3
context_noise: 0

adapter:
  type: "lora"
  rank: 256
  alpha: 256
  dropout: 0.0
  dtype: "bfloat16"
  verbose: false
